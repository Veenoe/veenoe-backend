name: Smoke DEV Sessions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veenoe-dev-session-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install smoke client
        run: python -m pip install 'httpx>=0.27.0,<1'
      - name: Exercise deployed DEV sessions
        env:
          DEV_API_BASE_URL: https://api-dev.veenoe.com
          DEV_OWNER_TOKEN: ${{ secrets.DEV_SMOKE_OWNER_TOKEN }}
          DEV_OTHER_TOKEN: ${{ secrets.DEV_SMOKE_OTHER_TOKEN }}
        run: python scripts/smoke_dev_sessions.py
      - name: Record DEV evidence
        run: echo 'DEV session create/read/update/history/pagination/ownership/delete smoke passed against the real deployed API.' >> "$GITHUB_STEP_SUMMARY"
