name: Deploy Development

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Terraform deployment operation"
        required: true
        type: choice
        default: "PLAN"
        options:
          - PLAN
          - APPLY

concurrency:
  group: veenoe-dev-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Build and Verify Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit test suite
        run: |
          pytest -v tests/test_runtime_config.py

      - name: Build Lambda package artifact
        run: |
          python scripts/build_lambda.py

      - name: Run packaging & artifact verification tests
        run: |
          pytest -v tests/test_packaging.py

      - name: Upload verified Lambda package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veenoe-backend-zip
          path: dist/veenoe-backend.zip
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to AWS DEV
    needs: verify
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified Lambda package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: veenoe-backend-zip
          path: dist

      - name: Verify artifact integrity
        run: |
          if [ ! -f dist/veenoe-backend.zip ]; then
            echo "Error: dist/veenoe-backend.zip not found!" >&2
            exit 1
          fi
          echo "Verified artifact dist/veenoe-backend.zip:"
          ls -lh dist/veenoe-backend.zip

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.0"
          terraform_wrapper: false

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::165835313361:role/veenoe-github-actions-dev-deploy
          aws-region: ap-south-1
          allowed-account-ids: "165835313361"
          role-session-name: "github-actions-dev-deploy-${{ github.run_id }}"

      - name: Verify assumed AWS identity
        run: |
          IDENTITY=$(aws sts get-caller-identity --output json)
          ACCOUNT=$(echo "${IDENTITY}" | jq -r '.Account')
          ARN=$(echo "${IDENTITY}" | jq -r '.Arn')
          echo "Assumed identity ARN: ${ARN}"
          if [ "${ACCOUNT}" != "165835313361" ]; then
            echo "Error: Unexpected AWS Account ID: ${ACCOUNT}" >&2
            exit 1
          fi
          if [[ "${ARN}" != *"veenoe-github-actions-dev-deploy"* ]]; then
            echo "Error: Unexpected IAM Role ARN: ${ARN}" >&2
            exit 1
          fi

      - name: Initialize Terraform for DEV application
        run: |
          terraform -chdir=infra/app init -input=false -backend-config=dev.backend.hcl

      - name: Validate Terraform configuration
        run: |
          terraform -chdir=infra/app validate

      - name: Generate DEV Terraform execution plan
        run: |
          terraform -chdir=infra/app plan -input=false -var-file=dev.tfvars -out=dev.tfplan

      - name: Inspect plan actions and safety guard
        run: |
          PLAN_JSON=$(terraform -chdir=infra/app show -json dev.tfplan)

          # Extract all active resource changes (excluding no-op and read)
          ACTIVE_CHANGES=$(echo "${PLAN_JSON}" | jq -c '
            [.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])]
          ')

          echo "Active resource changes in saved plan:"
          echo "${ACTIVE_CHANGES}" | jq -r '.[] | "  - \(.address): \(.change.actions | join(","))"'

          TOTAL_CHANGES=$(echo "${ACTIVE_CHANGES}" | jq 'length')
          CREATE_COUNT=$(echo "${ACTIVE_CHANGES}" | jq '[.[] | select(.change.actions == ["create"])] | length')
          UPDATE_COUNT=$(echo "${ACTIVE_CHANGES}" | jq '[.[] | select(.change.actions == ["update"])] | length')
          DELETE_COUNT=$(echo "${ACTIVE_CHANGES}" | jq '[.[] | select(.change.actions[] | contains("delete"))] | length')

          echo "Plan change summary: total=${TOTAL_CHANGES}, create=${CREATE_COUNT}, update=${UPDATE_COUNT}, delete/replace=${DELETE_COUNT}"

          if [ "${DELETE_COUNT}" -gt 0 ]; then
            echo "ERROR: Destructive changes detected in saved plan! Automatic deletion/replacement is blocked." >&2
            echo "${ACTIVE_CHANGES}" | jq -r '.[] | select(.change.actions[] | contains("delete")) | "  - \(.address): \(.change.actions | join(","))"' >&2
            exit 1
          fi
          echo "Plan safety validation passed: 0 destructive changes detected."

          if [ "${{ github.event.inputs.operation || 'PLAN' }}" = "PLAN" ]; then
            echo "========================================================================"
            echo "PLAN OPERATION COMPLETE: Inspection passed. AWS resources will NOT be mutated."
            echo "========================================================================"
          fi

      - name: Apply saved DEV Terraform plan
        if: ${{ github.event.inputs.operation == 'APPLY' }}
        run: |
          terraform -chdir=infra/app apply -input=false dev.tfplan

      - name: Live positive smoke test (GET /)
        if: ${{ github.event.inputs.operation == 'APPLY' }}
        run: |
          HEALTH_URL=$(terraform -chdir=infra/app output -raw health_url)
          echo "Smoke testing health URL: ${HEALTH_URL}"
          SUCCESS=false
          for i in {1..12}; do
            echo "Smoke test attempt ${i}/12..."
            RESPONSE=$(curl -s -w "\n%{http_code}" "${HEALTH_URL}" || true)
            HTTP_STATUS=$(echo "${RESPONSE}" | tail -n1)
            BODY=$(echo "${RESPONSE}" | sed '$d')
            if [ "${HTTP_STATUS}" = "200" ] && echo "${BODY}" | grep -q '"status":[[:space:]]*"healthy"'; then
              echo "Smoke test passed (HTTP 200, status: healthy):"
              echo "${BODY}"
              SUCCESS=true
              break
            fi
            echo "Attempt ${i} returned HTTP ${HTTP_STATUS}. Waiting 5 seconds..."
            sleep 5
          done
          if [ "${SUCCESS}" != "true" ]; then
            echo "ERROR: Live health check failed after 12 attempts!" >&2
            exit 1
          fi

      - name: Live database connectivity test (GET /health)
        if: ${{ github.event.inputs.operation == 'APPLY' }}
        run: |
          API_ENDPOINT=$(terraform -chdir=infra/app output -raw api_endpoint)
          DB_HEALTH_URL="${API_ENDPOINT}/health"
          echo "Smoke testing database health URL: ${DB_HEALTH_URL}"
          RESPONSE=$(curl -s -w "\n%{http_code}" "${DB_HEALTH_URL}" || true)
          HTTP_STATUS=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')
          echo "GET /health returned HTTP ${HTTP_STATUS}: ${BODY}"
          if [ "${HTTP_STATUS}" != "200" ] || ! echo "${BODY}" | grep -q '"database":[[:space:]]*"connected"'; then
            echo "ERROR: Expected HTTP 200 with database: connected from GET /health!" >&2
            exit 1
          fi
          echo "Database health test passed (HTTP 200, database: connected)."

      - name: Live authentication gate test (POST /api/v1/viva/start without Authorization)
        if: ${{ github.event.inputs.operation == 'APPLY' }}
        run: |
          API_ENDPOINT=$(terraform -chdir=infra/app output -raw api_endpoint)
          START_URL="${API_ENDPOINT}/api/v1/viva/start"
          echo "Testing unauthenticated POST: ${START_URL}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${START_URL}" -H "Content-Type: application/json" -d '{}' || true)
          HTTP_STATUS=$(echo "${RESPONSE}" | tail -n1)
          BODY=$(echo "${RESPONSE}" | sed '$d')
          echo "POST /api/v1/viva/start without auth returned HTTP ${HTTP_STATUS}: ${BODY}"
          if [ "${HTTP_STATUS}" != "401" ]; then
            echo "ERROR: Expected HTTP 401 Unauthorized for unauthenticated POST, but got HTTP ${HTTP_STATUS}!" >&2
            exit 1
          fi
          echo "Authentication gate test passed: POST returned HTTP 401."

      - name: Live CORS preflight test (OPTIONS /api/v1/viva/start from app.veenoe.com)
        if: ${{ github.event.inputs.operation == 'APPLY' }}
        run: |
          API_ENDPOINT=$(terraform -chdir=infra/app output -raw api_endpoint)
          START_URL="${API_ENDPOINT}/api/v1/viva/start"
          echo "Testing CORS preflight on: ${START_URL}"
          RESPONSE=$(curl -s -i -X OPTIONS "${START_URL}" \
            -H "Origin: https://app.veenoe.com" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type")
          echo "${RESPONSE}"
          if ! echo "${RESPONSE}" | grep -qi "access-control-allow-origin: https://app.veenoe.com"; then
            echo "ERROR: Missing Access-Control-Allow-Origin header for https://app.veenoe.com!" >&2
            exit 1
          fi
          echo "CORS preflight test passed."

      - name: Live custom domain health check (if configured)
        if: ${{ github.event.inputs.operation == 'APPLY' }}
        run: |
          CUSTOM_URL=$(terraform -chdir=infra/app output -raw custom_domain_url 2>/dev/null || echo "")
          if [ -n "${CUSTOM_URL}" ] && [ "${CUSTOM_URL}" != "null" ]; then
            echo "Testing custom domain: ${CUSTOM_URL}/health"
            RESPONSE=$(curl -s -w "\n%{http_code}" "${CUSTOM_URL}/health" || true)
            HTTP_STATUS=$(echo "${RESPONSE}" | tail -n1)
            BODY=$(echo "${RESPONSE}" | sed '$d')
            echo "GET ${CUSTOM_URL}/health returned HTTP ${HTTP_STATUS}: ${BODY}"
            if [ "${HTTP_STATUS}" != "200" ]; then
              echo "WARNING: Custom domain health check returned HTTP ${HTTP_STATUS} (DNS may still be propagating)." >&2
            else
              echo "Custom domain verified successfully."
            fi
          fi

      - name: Verify post-apply zero-diff plan
        if: ${{ github.event.inputs.operation == 'APPLY' }}
        run: |
          echo "Verifying zero-diff post-apply plan..."
          terraform -chdir=infra/app plan -input=false -var-file=dev.tfvars -detailed-exitcode -no-color
