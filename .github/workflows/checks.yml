name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci-checks:
    name: Backend CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Lambda package artifact
        run: |
          python scripts/build_lambda.py

      - name: Run pytest suite
        run: |
          pytest -v tests/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive infra

      - name: Validate Terraform bootstrap configuration
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: "ap-south-1"
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate

      - name: Validate Terraform app configuration
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: "ap-south-1"
        run: |
          terraform -chdir=infra/app init -backend=false
          terraform -chdir=infra/app validate

      - name: Verify clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Uncommitted changes detected in working tree!" >&2
            git status --porcelain >&2
            exit 1
          fi
